<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4878E8" />
  <meta name="description" content="NexSpace 邻境工作台 - 一处空间，统筹所有事务" />
  <title>NexSpace 邻境工作台</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NexSpace" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <!-- Tailwind CDN（开发期直接用；上线时可替换为构建版） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#4878E8',
              50: '#EEF2FB',
              100: '#D8E1F5',
              500: '#4878E8',
              600: '#3A66D6',
              700: '#2D52B8'
            },
            accent: {
              purple: '#927DFF',
              mint: '#54D3B4',
              coral: '#FF6B6B'
            }
          },
          borderRadius: { 'card': '14px' },
          fontFamily: {
            sans: ['Inter', 'PingFang SC', 'Microsoft YaHei', 'sans-serif']
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.4s ease-out',
            'pulse-slow': 'pulse 3s ease-in-out infinite'
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' }
            }
          }
        }
      },
      darkMode: 'class'
    };
  </script>

  <!-- Iconify（轻量图标） -->
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

  <!-- Inter 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />

  <!-- 自定义样式 -->
  <link rel="stylesheet" href="/css/styles.css" />

  <!-- 主题初始化（防止页面闪烁） -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('nexspace.theme') || 'dark';
        if (t === 'light') document.documentElement.classList.remove('dark');
        else document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body class="bg-lightBg text-slate-900 dark:bg-darkBg dark:text-slate-100 antialiased min-h-screen overflow-x-hidden">

  <!-- ====== 启动加载动画 ====== -->
  <div id="splash-screen" class="fixed inset-0 z-[9999] flex items-center justify-center bg-darkBg">
    <div class="flex flex-col items-center gap-6">
      <div class="splash-logo">
        <svg viewBox="0 0 64 64" class="w-16 h-16">
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4878E8" />
              <stop offset="100%" stop-color="#927DFF" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g1)" />
          <path d="M20 22 L20 44 L28 44 L28 30 L36 44 L44 44 L44 22 L36 22 L36 36 L28 22 Z"
                fill="white" />
        </svg>
      </div>
      <div class="text-white/80 text-sm tracking-widest">NexSpace · 邻境工作台</div>
      <div class="splash-bar w-32 h-1 rounded-full overflow-hidden bg-white/10">
        <div class="h-full bg-gradient-to-r from-brand to-accent-purple"></div>
      </div>
    </div>
  </div>

  <!-- ====== Toast 容器 ====== -->
  <div id="toast-container" class="fixed top-4 right-4 z-[9998] space-y-2 pointer-events-none"></div>

  <!-- ====== 模态框容器 ====== -->
  <div id="modal-container"></div>

  <!-- ====== 登录页 ====== -->
  <section id="view-login" class="hidden fixed inset-0 z-[100] flex items-center justify-center px-4">
    <div class="login-card w-full max-w-md rounded-card p-10 backdrop-blur-xl
                bg-white/5 dark:bg-white/[0.04] border border-white/10
                shadow-card animate-slide-up">
      <div class="flex items-center gap-3 mb-2">
        <svg viewBox="0 0 64 64" class="w-10 h-10">
          <defs>
            <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#4878E8" />
              <stop offset="100%" stop-color="#927DFF" />
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g2)" />
          <path d="M20 22 L20 44 L28 44 L28 30 L36 44 L44 44 L44 22 L36 22 L36 36 L28 22 Z" fill="white" />
        </svg>
        <div>
          <h1 class="text-xl font-semibold text-white">NexSpace 邻境工作台</h1>
          <p class="text-xs text-white/60 mt-1">一处空间，统筹所有事务</p>
        </div>
      </div>

      <h2 id="auth-title" class="text-2xl font-semibold text-white mt-8 mb-6">登录</h2>

      <form id="auth-form" class="space-y-3">
        <div class="auth-field hidden">
          <label class="text-xs text-white/60 mb-1 block">昵称</label>
          <div class="auth-input-wrap">
            <iconify-icon icon="mdi:account-circle-outline"></iconify-icon>
            <input id="f-nickname" type="text" class="auth-input" placeholder="你想被如何称呼" maxlength="20" />
          </div>
        </div>
        <div>
          <label class="text-xs text-white/60 mb-1 block">账号</label>
          <div class="auth-input-wrap">
            <iconify-icon icon="mdi:account-outline"></iconify-icon>
            <input id="f-username" type="text" class="auth-input" placeholder="3-20 位字母/数字/下划线"
                   autocomplete="username" required minlength="3" maxlength="20" />
          </div>
        </div>
        <div>
          <label class="text-xs text-white/60 mb-1 block">密码</label>
          <div class="auth-input-wrap">
            <iconify-icon icon="mdi:lock-outline"></iconify-icon>
            <input id="f-password" type="password" class="auth-input" placeholder="至少 6 位"
                   autocomplete="current-password" required minlength="6" />
            <button type="button" id="f-toggle-pwd" class="text-white/40 hover:text-white/70">
              <iconify-icon icon="mdi:eye-outline"></iconify-icon>
            </button>
          </div>
        </div>

        <button type="submit" class="auth-submit">
          <span id="auth-submit-text">登 录</span>
        </button>
      </form>

      <div class="mt-6 flex items-center justify-between text-sm">
        <button id="auth-toggle" class="text-white/60 hover:text-white">还没有账号？立即注册</button>
        <label class="flex items-center gap-2 text-white/60 cursor-pointer select-none">
          <input id="f-remember" type="checkbox" checked class="accent-brand" />
          <span>记住登录</span>
        </label>
      </div>

      <p class="text-xs text-white/30 mt-10 leading-relaxed">
        提示：本工作台设计用于个人效率管理，<b class="text-accent-coral">不建议存储银行卡、私钥等高敏感信息</b>。
      </p>
    </div>
  </section>

  <!-- ====== 主应用容器 ====== -->
  <div id="app-root" class="hidden min-h-screen">

    <!-- 移动端顶部栏 -->
    <header id="mobile-topbar" class="md:hidden sticky top-0 z-30 flex items-center justify-between
                                       px-4 py-3 backdrop-blur-xl bg-white/60 dark:bg-darkBg/70 border-b border-white/10">
      <button id="mobile-menu-btn" class="p-2 -ml-2 rounded-lg hover:bg-white/10">
        <iconify-icon icon="mdi:menu" class="text-2xl"></iconify-icon>
      </button>
      <div class="flex items-center gap-2 font-semibold">
        <svg viewBox="0 0 64 64" class="w-6 h-6">
          <rect x="2" y="2" width="60" height="60" rx="14" fill="#4878E8" />
          <path d="M20 22 L20 44 L28 44 L28 30 L36 44 L44 44 L44 22 L36 22 L36 36 L28 22 Z" fill="white" />
        </svg>
        NexSpace
      </div>
      <button id="mobile-search-btn" class="p-2 -mr-2 rounded-lg hover:bg-white/10">
        <iconify-icon icon="mdi:magnify" class="text-2xl"></iconify-icon>
      </button>
    </header>

    <!-- 侧边导航 -->
    <aside id="sidebar"
           class="sidebar fixed md:sticky top-0 left-0 z-40 h-screen w-64
                  backdrop-blur-2xl bg-white/70 dark:bg-darkBg/80
                  border-r border-white/10
                  transition-transform duration-300 ease-out
                  -translate-x-full md:translate-x-0
                  flex flex-col">

      <!-- Logo 区 -->
      <div class="px-5 py-5 flex items-center justify-between border-b border-white/10">
        <div class="flex items-center gap-2">
          <svg viewBox="0 0 64 64" class="w-8 h-8">
            <defs>
              <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#4878E8" />
                <stop offset="100%" stop-color="#927DFF" />
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g3)" />
            <path d="M20 22 L20 44 L28 44 L28 30 L36 44 L44 44 L44 22 L36 22 L36 36 L28 22 Z" fill="white" />
          </svg>
          <div>
            <div class="font-semibold leading-tight">NexSpace</div>
            <div class="text-[10px] text-slate-400 leading-tight">邻境工作台</div>
          </div>
        </div>
        <button id="desktop-collapse-btn" class="hidden md:inline-flex p-2 rounded-lg hover:bg-white/10 text-slate-500">
          <iconify-icon icon="mdi:chevron-left" class="text-xl"></iconify-icon>
        </button>
        <button id="mobile-close-btn" class="md:hidden p-2 rounded-lg hover:bg-white/10 text-slate-500">
          <iconify-icon icon="mdi:close" class="text-xl"></iconify-icon>
        </button>
      </div>

      <!-- 导航 -->
      <nav id="sidebar-nav" class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
        <!-- 动态渲染 nav items -->
      </nav>

      <!-- 底部用户 -->
      <div class="p-3 border-t border-white/10">
        <div class="user-card rounded-card p-3 flex items-center gap-3
                    bg-gradient-to-br from-brand/20 to-accent-purple/20">
          <div id="user-avatar" class="w-9 h-9 rounded-full bg-brand text-white flex items-center justify-center font-semibold">
            N
          </div>
          <div class="flex-1 min-w-0">
            <div id="user-nickname" class="text-sm font-medium truncate">游客</div>
            <div id="user-username" class="text-[11px] text-slate-400 truncate">@guest</div>
          </div>
          <div class="flex items-center gap-1">
            <button id="theme-toggle-btn" class="p-1.5 rounded-lg hover:bg-white/10" title="切换主题">
              <iconify-icon icon="mdi:weather-night" class="text-lg"></iconify-icon>
            </button>
            <button id="logout-btn" class="p-1.5 rounded-lg hover:bg-white/10 text-accent-coral" title="退出登录">
              <iconify-icon icon="mdi:logout" class="text-lg"></iconify-icon>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- 侧边栏移动端蒙层 -->
    <div id="sidebar-mask" class="hidden fixed inset-0 z-30 bg-black/40 md:hidden"></div>

    <!-- 折叠态侧边迷你栏 -->
    <aside id="sidebar-mini"
           class="hidden md:flex sticky top-0 left-0 z-30 h-screen w-16 flex-col
                  backdrop-blur-2xl bg-white/70 dark:bg-darkBg/80 border-r border-white/10">
      <button id="sidebar-expand-btn" class="p-3 m-2 rounded-lg hover:bg-white/10">
        <iconify-icon icon="mdi:chevron-right" class="text-xl"></iconify-icon>
      </button>
      <div id="sidebar-mini-nav" class="flex-1 flex flex-col items-center gap-2 px-2"></div>
    </aside>

    <!-- 主区 -->
    <main id="main-area" class="flex-1 min-h-screen">
      <!-- 顶部工具条 -->
      <div class="topbar sticky top-0 md:top-0 z-20 px-4 md:px-8 py-3 md:py-4
                  flex items-center justify-between gap-3
                  backdrop-blur-xl bg-white/60 dark:bg-darkBg/70 border-b border-white/10">
        <div>
          <h2 id="view-title" class="text-lg md:text-xl font-semibold">仪表盘</h2>
          <p id="view-subtitle" class="text-xs text-slate-500 mt-0.5">今天也要好好工作 ✨</p>
        </div>
        <div class="flex items-center gap-2">
          <div class="hidden md:block relative">
            <input id="global-search" type="search" placeholder="全局搜索..."
                   class="w-72 pl-9 pr-3 py-2 rounded-full bg-white/10 border border-white/10
                          focus:outline-none focus:border-brand text-sm placeholder-slate-400" />
            <iconify-icon icon="mdi:magnify" class="absolute top-2.5 left-3 text-slate-400"></iconify-icon>
          </div>
          <button id="notifications-btn" class="relative p-2 rounded-lg hover:bg-white/10">
            <iconify-icon icon="mdi:bell-outline" class="text-xl"></iconify-icon>
            <span id="notif-badge" class="hidden absolute top-1 right-1 w-2 h-2 bg-accent-coral rounded-full"></span>
          </button>
        </div>
      </div>

      <!-- 视图容器 -->
      <div id="view-container" class="px-4 md:px-8 py-6 space-y-6 pb-44"></div>
    </main>
  </div>

  <!-- 通知浮窗 -->
  <div id="notif-dropdown" class="hidden fixed top-16 right-4 z-40 w-80 backdrop-blur-xl
                                  bg-white/90 dark:bg-darkBg/95 rounded-card border border-white/10
                                  shadow-card overflow-hidden"></div>

  <!-- PWA: 注册 Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch((e) => {
          console.warn('[PWA] SW 注册失败:', e);
        });
      });
    }
  </script>

  <!-- 应用脚本 -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/sync.js"></script>
  <script src="/js/modules.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
